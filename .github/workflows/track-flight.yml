name: Track Akasa Flight Price

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours, India time.
    - cron: "0 */3 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check flight price
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python flight_tracker.py

      - name: Save price history
        run: |
          git config user.name "flight-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.csv
          git diff --cached --quiet || git commit -m "Update flight price history"
          git push
