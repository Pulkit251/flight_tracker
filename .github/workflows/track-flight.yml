name: Track Navi Mumbai Bengaluru Flights

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours; GitHub Actions cron is UTC (these times align to IST).
    - cron: "30 2,5,8,11,14,17,20,23 * * *"

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check outbound and return flight prices
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python flight_tracker.py

      - name: Save price history and alert state
        run: |
          git config user.name "flight-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update NMI-BLR flight price history"
          git push
