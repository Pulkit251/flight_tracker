
name: Track Darbhanga Delhi Flights

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */1 * * *"

permissions:
  contents: write

# Avoid simultaneous runs modifying the same CSV/JSON files.
concurrency:
  group: flight-price-tracker
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Debug workflow trigger
        run: |
          echo "Workflow started successfully"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "UTC time: $(date -u)"

      - name: Check Darbhanga to Delhi flight prices
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PYTHONUNBUFFERED: "1"
        run: python flight_tracker.py

      - name: Save price history and alert state
        if: always()
        run: |
          mkdir -p data
          git config user.name "flight-price-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Update DBR-DEL flight price history"

            git pull --rebase origin "$GITHUB_REF_NAME"

            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "No data changes to commit."
          fi
